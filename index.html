<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>主题与风险看板</title>
<style>body{margin:0;background:#f3f4f2;color:#172b28;font:15px system-ui,sans-serif}header{padding:24px 5vw;background:#fff;border-bottom:1px solid #dce3df}h1{margin:0 0 8px;font-size:23px}p{margin:5px 0;color:#60716c}form{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}input,button{font:inherit;padding:11px 15px;border:1px solid #c4d1ca;border-radius:7px}input{min-width:220px}button{cursor:pointer;background:#174e42;color:white}button.secondary{background:white;color:#174e42}nav{display:none;gap:8px;margin-top:12px}#message{min-height:24px;margin-top:12px}iframe{display:none;width:100%;height:calc(100vh - 190px);border:0;background:white}</style></head>
<body><header><h1>主题与风险看板</h1><p>输入共享口令，在浏览器内解密查看。</p><form id="unlock"><input id="password" type="password" aria-label="共享口令" autocomplete="off" required><button>解锁</button></form><nav id="views"><button data-view="theme">主题看板</button><button data-view="risk">风险看板</button><button id="lock" class="secondary">锁定</button></nav><p id="message" role="status"></p></header>
<iframe id="dashboard" title="已解密看板" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe><script src="unlock.js"></script></body></html>
